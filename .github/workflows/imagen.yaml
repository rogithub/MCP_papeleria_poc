name: imagen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  imagen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Preparar buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64  # el cluster es x86
          push: true
          # En minúsculas: ghcr.io no acepta mayúsculas y el repo se llama MCP_papeleria_poc.
          tags: |
            ghcr.io/rogithub/mcp_papeleria_poc:latest
            ghcr.io/rogithub/mcp_papeleria_poc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
