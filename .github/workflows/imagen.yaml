name: imagen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  imagen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Preparar buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64  # el cluster es x86
          push: true
          # En minúsculas: ghcr.io no acepta mayúsculas y el repo se llama MCP_papeleria_poc.
          tags: |
            ghcr.io/rogithub/mcp_papeleria_poc:latest
            ghcr.io/rogithub/mcp_papeleria_poc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # El canal corre en la computadora de la papelería (Debian 13): se publica como asset del release
  # fijo «canal», que se reemplaza en cada push. El repo es público, así que se baja con curl.
  canal:
    runs-on: ubuntu-24.04  # glibc 2.39, menor que la de Debian 13
    permissions:
      contents: write

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Compilar el canal
        run: |
          cargo build --release --locked --bin canal_papeleria
          cp target/release/canal_papeleria canal-papeleria

      - name: Publicar en el release «canal»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view canal >/dev/null 2>&1 || \
            gh release create canal --title canal --notes "El canal de Claude Code para la computadora de la papelería."
          gh release upload canal canal-papeleria --clobber
          gh release edit canal --notes "El canal de Claude Code para la computadora de la papelería. Compilado de ${{ github.sha }}."
