[package]
name = "mcp-papeleria-poc"
version = "0.1.0"
edition = "2024"
description = "Prueba de vida: un MCP público para ver si Claude, en modo de voz desde el teléfono, puede usar un conector nuestro"
publish = false

[dependencies]
axum = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
